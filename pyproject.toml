[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-music"
version = "0.1.0"
description = "Hybrid Mamba-Transformer for Symbolic Music Generation"
readme = "README.md"
authors = [
    {name = "Mamba Music Team"}
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "miditok>=3.0.0",
    "pretty_midi>=0.2.9",
    "mido>=1.2.10",
    "tqdm>=4.62.0",
    "tensorboard>=2.8.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "scipy>=1.10.0",
    "transformers>=4.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "isort>=5.12.0",
    "ruff>=0.0.262",
    "mypy>=1.3.0",
    "pre-commit>=3.3.1",
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
]
mamba = [
    "causal-conv1d>=1.2.0",
    "mamba-ssm>=1.2.0",
]

[tool.setuptools.packages.find]
include = ["mamba_music", "mamba_music.*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | experiments/checkpoints
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip_glob = ["experiments/checkpoints/*"]
src_paths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "PT"]
ignore = ["E203", "E501"]
exclude = [
    ".git",
    ".mypy_cache",
    ".venv",
    "experiments/checkpoints",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "pretty_midi.*",
    "mido.*",
    "tqdm.*",
    "tensorboard.*",
    "miditok.*",
    "mamba_ssm.*",
    "hydra.*",
    "omegaconf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=src/mamba_music --cov-report=term-missing"